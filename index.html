<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国实时油价看板</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #2563eb;
      --up-color: #dc2626;    /* 国内习惯：涨为红 */
      --down-color: #16a34a;  /* 国内习惯：跌为绿 */
      --flat-color: #9ca3af;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-group .update-time {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .next-adjust-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .next-adjust-box strong {
      font-size: 1rem;
      color: #1d4ed8;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-input, .select-input {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .search-input:focus, .select-input:focus {
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
      margin-bottom: 12px;
    }

    .province-name {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .main-price-tag {
      text-align: right;
    }

    .main-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .price-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .price-item {
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .price-item .label {
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .price-item .val-group {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price-item .val {
      font-weight: 600;
    }

    /* 变化趋势样式 */
    .diff {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .diff.up {
      color: var(--up-color);
      background-color: #fef2f2;
    }

    .diff.down {
      color: var(--down-color);
      background-color: #f0fdf4;
    }

    .diff.flat {
      color: var(--flat-color);
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      header {
        padding: 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>油价行情看板</h1>
        <div class="update-time" id="updateTime">正在加载数据...</div>
      </div>
      <div class="next-adjust-box" id="nextAdjustBox">
        <span>预计下一次调价时间：</span>
        <strong id="nextAdjustDate">计算中...</strong>
      </div>
      <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索省份..." oninput="render()">
        <select id="sortSelect" class="select-input" onchange="render()">
          <option value="default">默认排序</option>
          <option value="92_desc">92# 汽油 (从高到低)</option>
          <option value="92_asc">92# 汽油 (从低到高)</option>
          <option value="95_desc">95# 汽油 (从高到低)</option>
          <option value="95_asc">95# 汽油 (从低到高)</option>
        </select>
      </div>
    </header>

    <div class="grid" id="cardsGrid">
      <!-- 动态渲染油价卡片 -->
    </div>
  </div>

  <script>
    // 假设数据路径（GitHub Actions 生成的数据路径）
    const DATA_URL = './data/latest.json';
    const HOLIDAY_API_URL = 'https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/2026.json';

    let currentData = null;
    let previousData = null;
    let holidayData = null;

    // 格式化时间显示
    function formatDate(isoString) {
      if (!isoString) return '--';
      const date = new Date(isoString);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    // 计算价格变化
    function getDiffBadge(currentVal, prevVal) {
      const c = parseFloat(currentVal);
      const p = parseFloat(prevVal);

      if (isNaN(c) || c === 0) return '<span class="diff flat">-</span>';
      if (isNaN(p) || p === 0) return '<span class="diff flat">持平</span>';

      const diff = (c - p).toFixed(2);
      if (diff > 0) {
        return `<span class="diff up">↑ +${diff}</span>`;
      } else if (diff < 0) {
        return `<span class="diff down">↓ ${diff}</span>`;
      } else {
        return `<span class="diff flat">= 持平</span>`;
      }
    }

    // 格式化价格数值，如果是0则显示 -
    function formatPrice(val) {
      const p = parseFloat(val);
      return (isNaN(p) || p === 0) ? '-' : `￥${p.toFixed(2)}`;
    }

    // 判断某一天是否为工作日（考虑到法定节假日与调休补班）
    function isWorkingDay(date, holidaysMap) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const dateStr = `${year}-${month}-${day}`;

      if (holidaysMap && holidaysMap.has(dateStr)) {
        return !holidaysMap.get(dateStr); // isOffDay为true则非工作日，为false表示调休上班
      }

      const dayOfWeek = date.getDay();
      return dayOfWeek !== 0 && dayOfWeek !== 6; // 周一到周五为常规工作日
    }

    // 根据最后更新时间往后推算 10 个工作日得出下一次调价日期（调价通常在第10个工作日24时生效）
    function calculateNextAdjustDate(startDateStr, holidayList) {
      if (!startDateStr) return '--';
      
      const holidaysMap = new Map();
      if (holidayList && holidayList.days) {
        holidayList.days.forEach(item => holidaysMap.set(item.date, item.isOffDay));
      }

      let currentDate = new Date(startDateStr);
      let workDaysCount = 0;

      while (workDaysCount < 10) {
        currentDate.setDate(currentDate.getDate() + 1);
        if (isWorkingDay(currentDate, holidaysMap)) {
          workDaysCount++;
        }
      }

      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const day = String(currentDate.getDate()).padStart(2, '0');
      
      // 计算距离今天还有几天
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const targetDate = new Date(currentDate);
      targetDate.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));

      let countdownText = '';
      if (diffDays > 0) {
        countdownText = ` (还剩 ${diffDays} 天)`;
      } else if (diffDays === 0) {
        countdownText = ' (今天24时)';
      }

      return `${year}年${month}月${day}日 24:00${countdownText}`;
    }

    async function fetchHolidays() {
      try {
        const res = await fetch(HOLIDAY_API_URL);
        if (res.ok) {
          holidayData = await res.json();
        }
      } catch (e) {
        console.warn('获取节假日数据失败，将按照默认工作日计算', e);
      }
    }

    async function init() {
      try {
        // 并行加载节假日API与油价数据
        const [, res] = await Promise.all([
          fetchHolidays(),
          fetch(DATA_URL + '?t=' + new Date().getTime())
        ]);

        // 从缓存中读取上一期数据（用于计算比对）
        const cached = localStorage.getItem('last_oil_data');
        if (cached) {
          previousData = JSON.parse(cached);
        }

        if (!res.ok) throw new Error('网络请求失败');
        currentData = await res.json();

        // 刷新 updateTime
        document.getElementById('updateTime').innerText = `更新时间：${formatDate(currentData.updated_at)}`;

        // 计算下一次油价调整时间
        const nextAdjust = calculateNextAdjustDate(currentData.updated_at, holidayData);
        document.getElementById('nextAdjustDate').innerText = nextAdjust;

        // 更新本地缓存（仅在时间不同时保存为对比参照）
        if (!previousData || previousData.updated_at !== currentData.updated_at) {
          localStorage.setItem('last_oil_data', JSON.stringify(currentData));
        }

        render();
      } catch (err) {
        console.error(err);
        document.getElementById('updateTime').innerText = '数据加载失败，请重试';
        document.getElementById('nextAdjustDate').innerText = '--';
      }
    }

    function render() {
      if (!currentData || !currentData.provinces) return;

      const grid = document.getElementById('cardsGrid');
      const searchKeyword = document.getElementById('searchInput').value.trim();
      const sortType = document.getElementById('sortSelect').value;

      let provinces = Object.values(currentData.provinces);

      // 1. 过滤省份
      if (searchKeyword) {
        provinces = provinces.filter(p => p.province.includes(searchKeyword));
      }

      // 2. 排序
      provinces.sort((a, b) => {
        if (sortType === '92_desc') return parseFloat(b.t92) - parseFloat(a.t92);
        if (sortType === '92_asc') return parseFloat(a.t92) - parseFloat(b.t92);
        if (sortType === '95_desc') return parseFloat(b.t95) - parseFloat(a.t95);
        if (sortType === '95_asc') return parseFloat(a.t95) - parseFloat(b.t95);
        return 0; // 默认原顺序
      });

      // 3. 渲染
      grid.innerHTML = provinces.map(p => {
        const prevP = previousData && previousData.provinces ? previousData.provinces[p.province] : null;

        return `
          <div class="card">
            <div class="card-header">
              <span class="province-name">${p.province}</span>
              <div class="main-price-tag">
                <div class="main-price">${formatPrice(p.t92)}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">92# 汽油</div>
              </div>
            </div>
            <div class="price-list">
              <div class="price-item">
                <span class="label">89# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t89)}</span>
                  ${getDiffBadge(p.t89, prevP ? prevP.t89 : null)}
                </div>
              </div>
              <div class="price-item">
                <span class="label">92# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t92)}</span>
                  ${getDiffBadge(p.t92, prevP ? prevP.t92 : null)}
                </div>
              </div>
              <div class="price-item">
                <span class="label">95# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t95)}</span>
                  ${getDiffBadge(p.t95, prevP ? prevP.t95 : null)}
                </div>
              </div>
              <div class="price-item">
                <span class="label">98# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t98)}</span>
                  ${getDiffBadge(p.t98, prevP ? prevP.t98 : null)}
                </div>
              </div>
              <div class="price-item" style="grid-column: span 2;">
                <span class="label">0# 柴油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t0)}</span>
                  ${getDiffBadge(p.t0, prevP ? prevP.t0 : null)}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }






    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
