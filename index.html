<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国实时油价看板</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #2563eb;
      --up-color: #dc2626;    /* 国内习惯：涨为红 */
      --down-color: #16a34a;  /* 国内习惯：跌为绿 */
      --flat-color: #9ca3af;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .title-group .update-time {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .next-adjust-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      color: #1e40af;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .next-adjust-box strong {
      font-size: 1rem;
      color: #1d4ed8;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-input, .select-input {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .search-input:focus, .select-input:focus {
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
      margin-bottom: 12px;
    }

    .province-name {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .main-price-tag {
      text-align: right;
    }

    .main-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .price-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .price-item {
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .price-item .label {
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .price-item .val-group {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price-item .val {
      font-weight: 600;
    }

    /* 变化趋势样式 */
    .diff {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .diff.up {
      color: var(--up-color);
      background-color: #fef2f2;
    }

    .diff.down {
      color: var(--down-color);
      background-color: #f0fdf4;
    }

    .diff.flat {
      color: var(--flat-color);
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      header {
        padding: 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>油价行情看板</h1>
        <div class="update-time" id="updateTime">正在加载数据...</div>
      </div>
      <div class="next-adjust-box" id="nextAdjustBox">
        <strong id="nextAdjustDate">计算中...</strong>
      </div>
      <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索省份..." oninput="render()">
        <select id="sortSelect" class="select-input" onchange="render()">
          <option value="default">默认排序</option>
          <option value="92_desc">92# 汽油 (从高到低)</option>
          <option value="92_asc">92# 汽油 (从低到高)</option>
          <option value="95_desc">95# 汽油 (从高到低)</option>
          <option value="95_asc">95# 汽油 (从低到高)</option>
        </select>
      </div>
    </header>

    <div class="grid" id="cardsGrid">
      <!-- 动态渲染油价卡片 -->
    </div>
  </div>

  <script>
    const DATA_URL = './data/latest.json';

    // 2026 年成品油 25 轮调价完整窗口期（均在当天 24:00 生效）
    const ADJUST_SCHEDULE_2026 = [
      '2026-01-06', '2026-01-20',
      '2026-02-03', '2026-02-24',
      '2026-03-09', '2026-03-23',
      '2026-04-07', '2026-04-21',
      '2026-05-08', '2026-05-21',
      '2026-06-04', '2026-06-18',
      '2026-07-03', '2026-07-17', '2026-07-31',
      '2026-08-14', '2026-08-28',
      '2026-09-11', '2026-09-24',
      '2026-10-15', '2026-10-29',
      '2026-11-12', '2026-11-26',
      '2026-12-10', '2026-12-24'
    ];

    let currentData = null;
    let previousData = null;

    // 格式化日期：不包含年份（MM月DD日）
    function formatDateNoYear(dateObj) {
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${month}月${day}日`;
    }

    // 格式化更新时间（包含完整年月日与时分秒）
    function formatDateFull(isoString) {
      if (!isoString) return '--';
      const date = new Date(isoString);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    // 计算价格变化
    function getDiffBadge(currentVal, prevVal) {
      const c = parseFloat(currentVal);
      const p = parseFloat(prevVal);

      if (isNaN(c) || c === 0) return '<span class="diff flat">-</span>';
      if (isNaN(p) || p === 0) return '<span class="diff flat">持平</span>';

      const diff = (c - p).toFixed(2);
      if (diff > 0) {
        return `<span class="diff up">↑ +${diff}</span>`;
      } else if (diff < 0) {
        return `<span class="diff down">↓ ${diff}</span>`;
      } else {
        return `<span class="diff flat">= 持平</span>`;
      }
    }

    // 格式化价格数值
    function formatPrice(val) {
      const p = parseFloat(val);
      return (isNaN(p) || p === 0) ? '-' : `￥${p.toFixed(2)}`;
    }

    // 根据 25 轮调价日历精准匹配下一个调价日并计算剩余天数
    function calculateNextAdjustDate() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let targetDateStr = null;
      for (const dateStr of ADJUST_SCHEDULE_2026) {
        const itemDate = new Date(dateStr + 'T00:00:00');
        if (itemDate >= today) {
          targetDateStr = dateStr;
          break;
        }
      }

      if (!targetDateStr) return '调价时间：--';

      const targetDate = new Date(targetDateStr + 'T00:00:00');
      const diffDays = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));

      let countdownText = '';
      if (diffDays > 0) {
        countdownText = ` (还剩 ${diffDays} 天)`;
      } else if (diffDays === 0) {
        countdownText = ' (今天 24:00)';
      } else {
        countdownText = ' (已到调价日)';
      }

      const formattedMonthDay = formatDateNoYear(targetDate);
      return `调价时间：${formattedMonthDay} 24:00${countdownText}`;
    }

    async function init() {
      try {
        const cached = localStorage.getItem('last_oil_data');
        if (cached) {
          previousData = JSON.parse(cached);
        }

        const res = await fetch(DATA_URL + '?t=' + new Date().getTime());
        if (!res.ok) throw new Error('网络请求失败');
        currentData = await res.json();

        document.getElementById('updateTime').innerText = `更新时间：${formatDateFull(currentData.updated_at)}`;

        // 计算下一个调价日（不含年份）
        document.getElementById('nextAdjustDate').innerText = calculateNextAdjustDate();

        if (!previousData || previousData.updated_at !== currentData.updated_at) {
          localStorage.setItem('last_oil_data', JSON.stringify(currentData));
        }

        render();
      } catch (err) {
        console.error(err);
        document.getElementById('updateTime').innerText = '数据加载失败，请重试';
        document.getElementById('nextAdjustDate').innerText = '调价时间：--';
      }
    }

    function render() {
      if (!currentData || !currentData.provinces) return;

      const grid = document.getElementById('cardsGrid');
      const searchKeyword = document.getElementById('searchInput').value.trim();
      const sortType = document.getElementById('sortSelect').value;

      let provinces = Object.values(currentData.provinces);

      if (searchKeyword) {
        provinces = provinces.filter(p => p.province.includes(searchKeyword));
      }

      provinces.sort((a, b) => {
        if (sortType === '92_desc') return parseFloat(b.t92) - parseFloat(a.t92);
        if (sortType === '92_asc') return parseFloat(a.t92) - parseFloat(b.t92);
        if (sortType === '95_desc') return parseFloat(b.t95) - parseFloat(a.t95);
        if (sortType === '95_asc') return parseFloat(a.t95) - parseFloat(b.t95);
        return 0;
      });

      grid.innerHTML = provinces.map(p => {
        const prevP = previousData && previousData.provinces ? previousData.provinces[p.province] : null;

        return `
          <div class="card">
            <div class="card-header">
              <span class="province-name">${p.province}</span>
              <div class="main-price-tag">
                <div class="main-price">${formatPrice(p.t92)}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">92# 汽油</div>
              </div>
            </div>
            <div class="price-list">
              <div class="price-item">
                <span class="label">89# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t89)}</span>
                  ${getDiffBadge(p.t89, prevP ? prevP.t89 : null)}
                </div>
              </div>
              <div class="price-item">
                <span class="label">92# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t92)}</span>
                  ${getDiffBadge(p.t92, prevP ? prevP.t92 : null)}
                </div>
              </div>
              <div class="price-item">
                <span class="label">95# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t95)}</span>
                  ${getDiffBadge(p.t95, prevP ? prevP.t95 : null)}
                </div>
              </div>
              <div class="price-item">
                <span class="label">98# 汽油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t98)}</span>
                  ${getDiffBadge(p.t98, prevP ? prevP.t98 : null)}
                </div>
              </div>
              <div class="price-item" style="grid-column: span 2;">
                <span class="label">0# 柴油</span>
                <div class="val-group">
                  <span class="val">${formatPrice(p.t0)}</span>
                  ${getDiffBadge(p.t0, prevP ? prevP.t0 : null)}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
